services:
  # --------------------------------------------------------------------------
  # 1. IntellMeet Backend API & WebSockets Signaling
  # --------------------------------------------------------------------------
  - type: web
    name: intellmeet-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build --workspace=@intellmeet/shared && node --max-old-space-size=2048 ./node_modules/typescript/bin/tsc -p apps/api/tsconfig.json
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false # Set your Groq API key in the Render dashboard
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: MONGODB_URI
        sync: false # Set this to your MongoDB Atlas connection URI (or leave blank to use automatic in-memory DB)
      - key: ALLOW_IN_MEMORY_DB
        value: "true"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromStaticSite:
          name: intellmeet-web
          type: url
      - key: CORS_ORIGINS
        fromStaticSite:
          name: intellmeet-web
          type: url

  # --------------------------------------------------------------------------
  # 2. IntellMeet Frontend SPA
  # --------------------------------------------------------------------------
  - type: web
    name: intellmeet-web
    env: static
    plan: free
    region: oregon
    buildCommand: npm install && npm run build --workspace=@intellmeet/shared && npm run build --workspace=@intellmeet/web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: intellmeet-api
          type: web
          property: host
